plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '1.0.1-r2'
group = 'cn.blockforge.generated.moda3c26b8e'
base { archivesName = 'z80z-throwable-torch' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            mods { "z80z_throwable_torch" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            mods { "z80z_throwable_torch" { source sourceSets.main } }
        }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    def props = [mod_id: 'z80z_throwable_torch', mod_name: 'Z80Z 可投掷火把', mod_version: project.version,
                 minecraft_version: '1.20.1', forge_version: '47.4.0']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}
jar.finalizedBy('reobfJar')
